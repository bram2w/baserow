apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.baserow.sharedConfigMap }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "2"
  labels:
    {{- include "baserow.global.labels" . | nindent 4 }}
{{- /* Values set in sharedConfigMap take precedence over the generated ones. */}}
{{- $data := dict
  "PUBLIC_BACKEND_URL" (printf "https://%s" (include "baserow.global.backendDomain" .))
  "PUBLIC_WEB_FRONTEND_URL" (printf "https://%s" .Values.global.baserow.domain)
  "PRIVATE_BACKEND_URL" (printf "http://%s" (include "baserow.fullname" (index .Subcharts "baserow-backend-wsgi")))
}}
{{- if .Values.global.baserow.assistantLLMModel }}
{{- $_ := set $data "BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL" .Values.global.baserow.assistantLLMModel }}
{{- end }}
data:
{{- range $key, $val := mergeOverwrite $data (.Values.sharedConfigMap | default dict) }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
