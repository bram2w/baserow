apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.baserow.backendSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "2"
  labels:
    {{- include "baserow.global.labels" . | nindent 4 }}
type: Opaque
{{- /* Values set in backendSecrets take precedence over the generated ones. */}}
{{- $data := dict }}
{{- if .Values.minio.enabled }}
{{- $_ := set $data "AWS_ACCESS_KEY_ID" (include "minio.secret.userValue" .Subcharts.minio) }}
{{- $_ := set $data "AWS_SECRET_ACCESS_KEY" (include "minio.secret.passwordValue" .Subcharts.minio) }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $_ := set $data "DATABASE_HOST" (include "postgresql.v1.primary.fullname" .Subcharts.postgresql) }}
{{- $_ := set $data "DATABASE_PORT" (include "postgresql.v1.service.port" .Subcharts.postgresql) }}
{{- $_ := set $data "DATABASE_NAME" (include "postgresql.v1.database" .Subcharts.postgresql) }}
{{- $_ := set $data "DATABASE_PASSWORD" (include "baserow.global.postgresql.password" .) }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $_ := set $data "REDIS_HOST" (printf "%s-master" (include "common.names.fullname" .Subcharts.redis)) }}
{{- $_ := set $data "REDIS_PORT" (tpl (toString .Values.redis.master.service.ports.redis) $) }}
{{- $_ := set $data "REDIS_PASSWORD" (include "redis.password" .Subcharts.redis) }}
{{- end }}
{{- if .Values.generateJwtSecret }}
{{- $_ := set $data "BASEROW_JWT_SIGNING_KEY" (include "baserow.global.jwt.signing_key" .) }}
{{- $_ := set $data "SECRET_KEY" (include "baserow.global.jwt.secret_key" .) }}
{{- end }}
data:
{{- range $key, $val := mergeOverwrite $data (.Values.backendSecrets | default dict) }}
  {{ $key }}: {{ $val | toString | b64enc | quote }}
{{- end }}
